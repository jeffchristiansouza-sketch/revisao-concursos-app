<script>
/* Revisão Concursos — versão fora do Claude.
   Substitui o armazenamento do Claude (claude.use('db') e claude.use('downloads')) por:
   - modo "sincronizado": arquivos JSON no ramo "dados" do repositório privado no GitHub, com cópia local (funciona offline);
   - modo "local": dados só neste aparelho (localStorage).
   O restante do app é o mesmo código do artefato. */
(function () {
  'use strict';
  var FB_VER = '10.12.2';
  /* edição para outra pessoa (window.RC_ED): só neste aparelho, chaves próprias no navegador e plano inicial carregado de um arquivo */
  var ED = window.RC_ED || null, PRE = ED ? ED.pref : '';
  var CONN_KEY = PRE + 'rc_conn_v1', LOCAL_KEY = PRE + 'rc_localdb_v1';
  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var cp = function (o) { return o == null ? o : JSON.parse(JSON.stringify(o)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function say(t) { try { if (typeof window.toast === 'function') return window.toast(t); } catch (e) {} console.warn(t); }
  function conn() { try { return JSON.parse(LS.get(CONN_KEY) || 'null'); } catch (e) { return null; } }
  function setConn(c) { LS.set(CONN_KEY, JSON.stringify(c)); }

  /* ---------- downloads ---------- */
  var DL = {
    save: function (o) {
      return new Promise(function (res) {
        var blob = new Blob([o.data], { type: /\.json$/.test(o.filename) ? 'application/json' : 'text/plain;charset=utf-8' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = o.filename || 'arquivo.txt';
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); res(); }, 400);
      });
    }
  };

  /* ---------- modo local ---------- */
  function LocalDB() {
    var st; try { st = JSON.parse(LS.get(LOCAL_KEY) || '{}'); } catch (e) { st = {}; }
    st.docs = st.docs || {};
    var L = new Set();
    function persist() { if (!LS.set(LOCAL_KEY, JSON.stringify(st))) say('Espaço do navegador cheio: baixe um backup.'); }
    function emit() { L.forEach(function (g) { try { g(); } catch (e) { console.error(e); } }); }
    window.addEventListener('storage', function (ev) { if (ev.key === LOCAL_KEY) { try { st = JSON.parse(ev.newValue || '{}'); st.docs = st.docs || {}; } catch (e) {} emit(); } });
    function depth(p) { return p.split('/').length; }
    function docSnap(p) { return { exists: Object.prototype.hasOwnProperty.call(st.docs, p), id: p.split('/').pop(), data: function () { return cp(st.docs[p]); } }; }
    function colSnap(c) {
      var pre = c + '/', d = depth(c) + 1;
      return { docs: Object.keys(st.docs).filter(function (p) { return p.indexOf(pre) === 0 && depth(p) === d; })
        .map(function (p) { return { id: p.split('/').pop(), data: function () { return cp(st.docs[p]); } }; }) };
    }
    function listen(make, f) { var g = function () { f(make()); }; L.add(g); setTimeout(g, 0); return function () { L.delete(g); }; }
    function ref(p) {
      return {
        set: function (d) { st.docs[p] = cp(d); persist(); emit(); return Promise.resolve(); },
        delete: function () { delete st.docs[p]; persist(); emit(); return Promise.resolve(); },
        onSnapshot: function (f) { return listen(function () { return docSnap(p); }, f); }
      };
    }
    return {
      doc: ref,
      collection: function (c) {
        return {
          doc: function (id) { return ref(c + '/' + (id || ('x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)))); },
          onSnapshot: function (f) { return listen(function () { return colSnap(c); }, f); }
        };
      }
    };
  }


  /* ---------- modo sincronizado (GitHub) ----------
     Cada coleção é um arquivo dados/<coleção>.json no ramo "dados":
       {"v":1,"docs":{"<id>":{"t":<ms>,"d":{...}} | {"t":<ms>,"x":1}}}
     t = hora da última alteração; x = apagado. Na junção vence o t maior, documento a documento.
     O aparelho guarda uma cópia em localStorage e trabalha sempre nela; a rede só sincroniza. */
  var GH = window.RC_GH || { owner: '', repo: '', branch: 'dados', dir: 'dados' };
  var BUCKETS = ['app', 'sessoes', 'ciclo', 'sim_tent', 'simulados', 'qfeito', 'flash', 'cartoes'];
  var SLOW = { sim_tent: 90000 };           /* intervalo mínimo entre envios; o simulado grava a cada resposta */
  var MIN_GAP = 8000, DEBOUNCE = 1500, POLL = 90000, TOMB_DIAS = 90;
  var GKEY = 'rc_g1_', GMETA = 'rc_g1_meta';

  function b64enc(str) {
    var u = new TextEncoder().encode(str), s = '', i;
    for (i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function b64dec(b) {
    var s = atob(String(b || '').replace(/\s+/g, '')), u = new Uint8Array(s.length), i;
    for (i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return new TextDecoder().decode(u);
  }
  function serial(docs) {
    var ids = Object.keys(docs).sort();
    return '{"v":1,"docs":{\n' + ids.map(function (id) { return JSON.stringify(id) + ':' + JSON.stringify(docs[id]); }).join(',\n') + '\n}}\n';
  }

  function GitDB(c) {
    var B = {}, L = {}, meta, busy = false, again = false, timer = null, lastPush = {};
    var sync = RC.sync = { st: 'ok', at: 0, msg: '' };
    try { meta = JSON.parse(LS.get(GMETA) || '{}'); } catch (e) { meta = {}; }
    meta.sha = meta.sha || {}; meta.dirty = meta.dirty || {};
    BUCKETS.forEach(function (b) {
      var o; try { o = JSON.parse(LS.get(GKEY + b) || '{}'); } catch (e) { o = {}; }
      B[b] = o || {}; L[b] = new Set();
    });
    function saveMeta() { LS.set(GMETA, JSON.stringify(meta)); }
    function saveB(b) { if (!LS.set(GKEY + b, JSON.stringify(B[b]))) say('Espaço do navegador cheio: avise o Claude.'); }
    function emit(b) { L[b].forEach(function (g) { try { g(); } catch (e) { console.error(e); } }); }
    function status(st, msg) {
      sync.st = st; sync.msg = msg || ''; if (st === 'ok') sync.at = Date.now();
      var el = document.getElementById('rc-sync'); if (el) el.innerHTML = RC_SYNCTXT();
    }
    function pend() { return BUCKETS.some(function (b) { return meta.dirty[b]; }); }

    /* outra aba do mesmo navegador gravou */
    window.addEventListener('storage', function (ev) {
      if (!ev.key || ev.key.indexOf(GKEY) !== 0) return;
      if (ev.key === GMETA) { try { meta = JSON.parse(ev.newValue || '{}'); meta.sha = meta.sha || {}; meta.dirty = meta.dirty || {}; } catch (e) {} return; }
      var b = ev.key.slice(GKEY.length); if (!B[b]) return;
      try { B[b] = JSON.parse(ev.newValue || '{}') || {}; } catch (e) {} emit(b);
    });

    /* ----- API do GitHub ----- */
    var API = 'https://api.github.com/repos/' + c.owner + '/' + c.repo;
    function gh(path, opt) {
      opt = opt || {};
      return fetch(API + path, {
        method: opt.method || 'GET', cache: 'no-store',
        headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
        body: opt.body ? JSON.stringify(opt.body) : undefined
      });
    }
    function fail(r) { var e = new Error('http ' + r.status); e.status = r.status; return e; }
    function listRemote() {
      return gh('/contents/' + GH.dir + '?ref=' + GH.branch).then(function (r) {
        if (r.status === 404) return {};
        if (!r.ok) throw fail(r);
        return r.json().then(function (a) { var o = {}; (a || []).forEach(function (f) { o[f.name] = f.sha; }); return o; });
      });
    }
    function getRemote(b) {
      return gh('/contents/' + GH.dir + '/' + b + '.json?ref=' + GH.branch).then(function (r) {
        if (r.status === 404) return { sha: null, docs: {} };
        if (!r.ok) throw fail(r);
        return r.json().then(function (j) {
          if (j.content) return { sha: j.sha, docs: (JSON.parse(b64dec(j.content)) || {}).docs || {} };
          /* arquivo acima de 1 MB: o conteúdo vem pelo endereço do blob */
          return gh('/git/blobs/' + j.sha).then(function (r2) { if (!r2.ok) throw fail(r2); return r2.json(); })
            .then(function (k) { return { sha: j.sha, docs: (JSON.parse(b64dec(k.content)) || {}).docs || {} }; });
        });
      });
    }
    function putRemote(b, docs, sha) {
      var body = { message: 'dados: ' + b + ' (app)', content: b64enc(serial(docs)), branch: GH.branch };
      if (sha) body.sha = sha;
      return gh('/contents/' + GH.dir + '/' + b + '.json', { method: 'PUT', body: body }).then(function (r) {
        if (!r.ok) throw fail(r);
        return r.json().then(function (j) { return j.content.sha; });
      });
    }
    /* junta o remoto no local; devolve se o local mudou */
    function merge(b, rem) {
      var loc = B[b], ch = false;
      Object.keys(rem).forEach(function (id) {
        var r = rem[id], l = loc[id];
        if (!r || typeof r.t !== 'number') return;
        if (!l || r.t > l.t) { loc[id] = r; ch = true; }
      });
      return ch;
    }
    function differs(b, rem) {
      var loc = B[b], ks = Object.keys(loc);
      if (ks.length !== Object.keys(rem).length) return true;
      return ks.some(function (id) { return !rem[id] || rem[id].t !== loc[id].t; });
    }
    function purge(b) {
      var lim = Date.now() - TOMB_DIAS * 864e5, loc = B[b];
      Object.keys(loc).forEach(function (id) { if (loc[id].x && loc[id].t < lim) delete loc[id]; });
    }
    function syncBucket(b, shaList, tries) {
      var remSha = shaList[b + '.json'] || null;
      var changedRemote = remSha !== (meta.sha[b] || null);
      if (!changedRemote && !meta.dirty[b]) return Promise.resolve();
      var wait = (SLOW[b] || MIN_GAP) - (Date.now() - (lastPush[b] || 0));
      var p = changedRemote ? getRemote(b) : Promise.resolve(null);
      return p.then(function (rem) {
        var need = !!meta.dirty[b];
        if (rem) {
          if (merge(b, rem.docs)) { saveB(b); emit(b); }
          remSha = rem.sha; need = differs(b, rem.docs);
          if (!need) { meta.sha[b] = remSha; delete meta.dirty[b]; saveMeta(); return; }
          meta.dirty[b] = 1; meta.sha[b] = remSha; saveMeta();
        }
        if (!need) return;
        if (wait > 0 && !sync.force) { schedule(wait + 200); return; }
        purge(b);
        var snap = JSON.stringify(B[b]);
        return putRemote(b, B[b], remSha).then(function (sha) {
          lastPush[b] = Date.now(); meta.sha[b] = sha;
          if (JSON.stringify(B[b]) === snap) delete meta.dirty[b]; else again = true;
          saveMeta();
        }, function (e) {
          /* alguém gravou no meio do caminho: lê de novo e tenta outra vez */
          if ((e.status === 409 || e.status === 422) && (tries || 0) < 3) {
            return listRemote().then(function (l2) { meta.sha[b] = '?'; return syncBucket(b, l2, (tries || 0) + 1); });
          }
          throw e;
        });
      });
    }
    function run() {
      if (busy) { again = true; return Promise.resolve(); }
      if (navigator.onLine === false) { status(pend() ? 'pend' : 'ok', 'Sem internet'); return Promise.resolve(); }
      busy = true; again = false; status('sync');
      return listRemote().then(function (list) {
        return BUCKETS.reduce(function (pr, b) { return pr.then(function () { return syncBucket(b, list); }); }, Promise.resolve());
      }).then(function () {
        status(pend() ? 'pend' : 'ok');
      }, function (e) {
        console.error(e);
        if (e.status === 401) status('err', 'Chave do GitHub recusada: ela venceu ou foi apagada. Gere outra e troque em Mais › Conta.');
        else if (e.status === 403 || e.status === 404) status('err', 'O GitHub negou o acesso ao repositório (erro ' + e.status + '). Confira a permissão da chave.');
        else status(pend() ? 'pend' : 'ok', 'Sem conexão com o GitHub');
      }).then(function () {
        busy = false; sync.force = false;
        if (again) schedule(DEBOUNCE);
      });
    }
    function schedule(ms) { clearTimeout(timer); timer = setTimeout(run, ms == null ? DEBOUNCE : ms); }

    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') schedule(300); else if (pend()) { sync.force = true; run(); } });
    window.addEventListener('online', function () { schedule(300); });
    setInterval(function () { if (document.visibilityState === 'visible') run(); }, POLL);

    /* ----- interface igual à do Firestore usada pelo app ----- */
    function split(p) { var i = p.indexOf('/'); return [p.slice(0, i), p.slice(i + 1)]; }
    function write(p, doc) {
      var s = split(p), b = s[0], id = s[1];
      if (!B[b]) { B[b] = {}; L[b] = new Set(); BUCKETS.push(b); }
      var old = B[b][id]; doc.t = Math.max(Date.now(), old ? old.t + 1 : 0);
      B[b][id] = doc; saveB(b); meta.dirty[b] = 1; saveMeta(); emit(b);
      if (sync.st !== 'err') status('pend');
      schedule();
      return Promise.resolve();
    }
    function live(b, id) { var x = B[b] && B[b][id]; return x && !x.x ? x : null; }
    function listen(b, make, f) { if (!L[b]) { L[b] = new Set(); B[b] = B[b] || {}; } var g = function () { f(make()); }; L[b].add(g); setTimeout(g, 0); return function () { L[b].delete(g); }; }
    function ref(p) {
      var s = split(p), b = s[0], id = s[1];
      return {
        set: function (d) { return write(p, { d: cp(d) }); },
        delete: function () { return write(p, { x: 1 }); },
        onSnapshot: function (f) { return listen(b, function () { var x = live(b, id); return { exists: !!x, id: id, data: function () { return x ? cp(x.d) : undefined; } }; }, f); }
      };
    }
    var db = {
      doc: ref,
      collection: function (col) {
        return {
          doc: function (id) { return ref(col + '/' + (id || ('x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)))); },
          onSnapshot: function (f) {
            return listen(col, function () {
              var o = B[col] || {};
              return { docs: Object.keys(o).filter(function (id) { return !o[id].x; }).map(function (id) { return { id: id, data: function () { return cp(o[id].d); } }; }) };
            }, f);
          }
        };
      }
    };
    return {
      db: db, run: run,
      now: function () { sync.force = true; return run(); },
      first: !meta.ok,
      markOk: function () { meta.ok = 1; saveMeta(); },
      failed: function () { return sync.st === 'err' || (sync.msg && !meta.ok); }
    };
  }

  /* aceita a chave do GitHub (github_pat_… ou ghp_…) ou o código de conexão copiado do outro aparelho */
  function parseConn(txt) {

    if (/^rc2:/.test(txt)) { try { var o = JSON.parse(b64dec(txt.slice(4))); return o && o.token ? o : null; } catch (e) { return null; } }
    var m = txt.match(/(github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})/);
    return m ? { owner: GH.owner, repo: GH.repo, token: m[1] } : null;

  var CSS = '#rc-setup{position:fixed;inset:0;z-index:50;overflow:auto;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}' +

  function showSetupEd(start) {

    el.querySelector('#rc-go').onclick = function () {

      fetch('https://api.github.com/repos/' + c.owner + '/' + c.repo + '/contents/' + GH.dir + '?ref=' + GH.branch, { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json' } })
        .then(function (r) {
          if (r.status === 401) { E.textContent = 'O GitHub recusou a chave: ela está incompleta, vencida ou foi apagada.'; return; }

  }

    return fetch('https://api.github.com/repos/' + c.owner + '/' + c.repo + '/contents/' + path + '?ref=main', {
      cache: 'no-store', headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github.raw+json', 'X-GitHub-Api-Version': '2022-11-28' }

  /* cartão "Conta" na aba Mais */
  function hora(ms) { var d = new Date(ms), p = function (n) { return (n < 10 ? '0' : '') + n; }; return p(d.getHours()) + ':' + p(d.getMinutes()); }
  window.RC_SYNCTXT = function () {
    var s = RC.sync; if (!s) return '';

    if (s.st === 'sync') return 'Sincronizando…';

    return 'Tudo sincronizado' + (s.at ? ' às ' + hora(s.at) : '') + '.' + (s.msg ? ' ' + esc(s.msg) + '.' : '');
  };
  window.RC_CONTA = function () {
    if (RC.modo === 'local' && ED) return '<h2>Conta</h2><div class="card"><div class="sub">Os dados ficam <b>só neste aparelho</b>. Para não perder nada (troca de celular, limpeza do navegador), baixe o backup completo abaixo de vez em quando e guarde o arquivo. Versão do app: ' + esc(window.RC_VER || '') + '</div></div>';
    if (RC.modo === 'local') return '<h2>Conta</h2><div class="card"><div class="sub">Modo: <b>só neste aparelho</b>. Os dados não sincronizam.</div>' +
      '<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn" onclick="RC_TROCAR()">Conectar ao GitHub</button></div></div>';

      '<div class="sub" id="rc-sync" style="margin-top:6px">' + RC_SYNCTXT() + '</div>' +

      '<div class="sub" style="margin-top:8px">O código de conexão contém a sua chave: use só para ligar outro aparelho seu. Versão do app: ' + esc(window.RC_VER || '') + '</div></div>';
    return '';
  };
  window.RC_AGORA = function () { if (RC.git) RC.git.now().then(function () { say(RC.sync.st === 'ok' && !RC.sync.msg ? 'Sincronizado' : (RC.sync.msg || 'Ainda há alterações para enviar')); }); };
  window.RC_CODIGO = function () { var t = connCode(RC.conn); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { say('Código copiado'); }, function () { prompt('Copie o código de conexão:', t); }); };

    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

<script>
/* ===== MOTOR (mesmas regras da planilha) ===== */
const DAY = 864e5;
function dn(iso){ if(!iso) return null; const p=iso.split('-'); return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/DAY); }
function iso(n){ const d=new Date(n*DAY); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function todayNum(){ const t=new Date(); return Math.floor(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/DAY); }
function keyOf(m,a,s){ return ((m||'')+'|'+(a||'')+'|'+(s||'')).toLowerCase().replace(/\s+/g,' ').trim(); }
const DEFAULT_CFG = {limite:4,minAmostra:10,altaPct:0.7,consPct:0.85,janela:7,escada:[1,3,7,14,30],degExtra:60,fAcAlto:1.3,fAcMed:1,fAcBaixo:0.7,fPeso5:0.8,fPeso4:0.9,fPeso3:1,fPeso12:1.2,pctZera:0.5,pctAlto:0.9,pctMed:0.8,dataPadrao:'2026-10-16',wRecente:0.6,prior:0.3,forca:10,qtdEq:5,satErro:0.5,horizonte:30,atrasoSat:14,urgVenc:0.85,ptsErro:50,ptsUrg:35,ptsPeso:15,minSubir:0.7,ativosFrente:true};

/* escada adaptativa: degraus 1-3-7-14-30 (+60) ajustados pelo acerto e pelo peso.
   - ponto de partida: o histórico do cadastro (questões anteriores ao app) já posiciona o assunto num degrau;
   - revisão boa sobe um degrau; ruim desce dois; abaixo de pctZera volta ao início;
   - amostra pequena mantém o degrau, mas soma com as próximas sessões até chegar ao mínimo de questões;
   - degrau extra só para acerto alto (>= pctAlto) em assunto de peso até 3. */
function fPeso(peso,cfg){peso=+peso||3;return peso>=5?cfg.fPeso5:peso>=4?cfg.fPeso4:peso>=3?cfg.fPeso3:cfg.fPeso12}
function fAc(pct,cfg){return pct>=cfg.pctAlto?cfg.fAcAlto:pct>=cfg.pctMed?cfg.fAcMed:cfg.fAcBaixo}
function degInicial(hist,cfg){if(!hist||!(hist.q>=cfg.minAmostra)||hist.p==null)return 0;return hist.p>=cfg.pctAlto?2:hist.p>=cfg.pctMed?1:0}
function intervalo(V,pct,conf,peso,cfg){const E=cfg.escada,top=E.length-1;const base=V>top?cfg.degExtra:E[Math.min(V,top)];
  return Math.max(1,Math.round(base*fPeso(peso,cfg)*(conf&&pct!=null?fAc(pct,cfg):1)))}
function ladder(list, cfg, peso, hist){
  const top=cfg.escada.length-1; let V=Math.min(degInicial(hist,cfg),top), bq=0, ba=0;
  return list.map(s=>{
    const q=+s.q||0, pct=q>0?(+s.ac||0)/q:0;
    bq+=q; ba+=+s.ac||0;                       /* soma as amostras pequenas até atingir o mínimo */
    const conf=bq>=cfg.minAmostra, pp=bq>0?ba/bq:0;
    const boa=conf&&pp>=cfg.minSubir, ruim=conf&&pp<cfg.minSubir;
    if(boa){ V+=1; const max=(cfg.degExtra>0&&pp>=cfg.pctAlto&&(+peso||3)<=3)?top+1:top; V=Math.min(V,max); }
    else if(ruim) V=pp<cfg.pctZera?0:Math.max(0,V-2);
    let interval=intervalo(V,pp,conf,peso,cfg);
    if(!conf&&V===0&&bq>0&&pp>=cfg.minSubir) interval=Math.max(interval,intervalo(1,null,false,peso,cfg)); /* poucas questões, todas bem: não volta amanhã */
    if(conf){bq=0;ba=0}
    return Object.assign({},s,{pct,boa,ruim,V,interval,next:dn(s.d)+interval});
  });
}
function sortSess(a,b){ return dn(a.d)-dn(b.d) || (a.n||0)-(b.n||0); }
function round1(x){ return Math.round(x*10)/10; }

function compute(items, sessions, cfg, today){
  const byKey=new Map();
  for(const s of sessions){ const k=keyOf(s.m,s.a,s.s); if(!byKey.has(k)) byKey.set(k,[]); byKey.get(k).push(s); }
  const known=new Set(items.map(i=>keyOf(i.m,i.a,i.s)));
  const orphan=sessions.filter(s=>!known.has(keyOf(s.m,s.a,s.s)));
  const rows=items.map((it,idx)=>{
    const k=keyOf(it.m,it.a,it.s);
    const X0=+it.q0||0, hist={q:X0>0?X0:(it.p0!=null?cfg.minAmostra:0),p:X0>0?(+it.a0||0)/X0:(it.p0==null?null:+it.p0)};
    const sess=ladder((byKey.get(k)||[]).slice().sort(sortSess),cfg,it.peso,hist);
    const U=sess.length, last=U?sess[U-1]:null, first=U?sess[0]:null;
    const qSes=sess.reduce((t,s)=>t+(+s.q||0),0), aSes=sess.reduce((t,s)=>t+(+s.ac||0),0);
    const X=+it.q0||0, Y=+it.a0||0;
    const qTot=qSes+X, aTot=aSes+Y;
    const pInf=(it.p0==null)?null:+it.p0;
    const pHist=qTot>0?aTot/qTot:pInf;
    const AA=(X+qSes===0 && pInf!=null)?1:0;
    let M=null; if(U) M=dn(last.d); else if(it.d0) M=dn(it.d0); else if(X>0||AA) M=dn(cfg.dataPadrao);
    const N=U?last.interval:(M!=null?intervalo(degInicial(hist,cfg),hist.p,hist.q>=cfg.minAmostra,it.peso,cfg):null);
    const AS=(M!=null&&N!=null)?M+N:null;
    let AB=null, AC=null;
    if(U){AB=last.q;AC=last.ac;} else if(X>0){AB=X;AC=Y;}
    let AD=null; if(AB!=null&&AB>0) AD=AC/AB; else if(AA) AD=pInf;
    const conf=(AB!=null&&AB>=cfg.minAmostra);
    let pri='';
    if(AD!=null){ pri=AA?'⚪ QTD DESCONHECIDA':!conf?'⚪ AMOSTRA PEQUENA':AD<cfg.altaPct?'🔴 ALTA':AD<cfg.consPct?'🟠 MÉDIA':'🟢 CONSOLIDADO'; }
    const peso=it.peso||3;
    const ABe=(AB==null||AB===0)?cfg.qtdEq:AB;
    let AG=null; if(AD==null){ if(AS!=null) AG=cfg.prior; } else AG=(ABe*(1-AD)+cfg.forca*cfg.prior)/(ABe+cfg.forca);
    let AH=null; if(pHist!=null){ const Ee=qTot>0?qTot:cfg.qtdEq; AH=(Ee*(1-pHist)+cfg.forca*cfg.prior)/(Ee+cfg.forca); }
    const AI=AG==null?null:Math.min(1,(cfg.wRecente*AG+(1-cfg.wRecente)*(AH==null?AG:AH))/cfg.satErro);
    const AT=AS==null?null:AS-today;
    const AJ=AT==null?0:(AT<=0?cfg.urgVenc+(1-cfg.urgVenc)*Math.min(1,-AT/cfg.atrasoSat):Math.max(0,cfg.urgVenc*(1-AT/cfg.horizonte)));
    const idxP=AI==null?null:round1(cfg.ptsErro*AI+cfg.ptsUrg*AJ+cfg.ptsPeso*peso/5);
    const variacao=(U>=2&&conf!=null&&last&&first)?(last.pct-first.pct):null;
    return {it,idx,key:k,sess,U,last,first,qTot,aTot,pHist,AA,M,N,AS,AB,AC,AD,conf,pri,peso,idxP,AT,ativo:(U>0||!!it.d0),variacao,plan:null};
  });
  /* nivelamento: no máximo N assuntos por dia; ativos primeiro, estoque preenche as vagas */
  const doneKeys=new Set(sessions.filter(s=>dn(s.d)===today).map(s=>keyOf(s.m,s.a,s.s)));
  const doneToday=doneKeys.size;
  const cap=new Map(); const capOf=d=>cap.has(d)?cap.get(d):Math.max(0,cfg.limite-(d===today?doneToday:0));
  const take=(r,from)=>{ let d=from; while(capOf(d)<=0) d++; cap.set(d,capOf(d)-1); r.plan=d; };
  const cand=rows.filter(r=>r.AS!=null&&!doneKeys.has(r.key));
  const ativos=cfg.ativosFrente?cand.filter(r=>r.ativo):cand;
  const estoque=cfg.ativosFrente?cand.filter(r=>!r.ativo):[];
  ativos.sort((a,b)=>(Math.max(today,a.AS)-Math.max(today,b.AS))||((b.idxP||0)-(a.idxP||0))||(a.idx-b.idx));
  for(const r of ativos) take(r,Math.max(today,r.AS));
  estoque.sort((a,b)=>((b.idxP||0)-(a.idxP||0))||(a.idx-b.idx));
  for(const r of estoque) take(r,today);
  const byDay=new Map();
  for(const r of rows) if(r.plan!=null){ if(!byDay.has(r.plan)) byDay.set(r.plan,[]); byDay.get(r.plan).push(r); }
  for(const l of byDay.values()) l.sort((a,b)=>((b.idxP||0)-(a.idxP||0))||(a.idx-b.idx));
  return {rows,byDay,doneToday,orphan,today};
}

function painel(model, sessions, cfg){
  const {rows,byDay,today}=model;
  const mats=[...new Set(rows.map(r=>r.it.m))];
  const per=mats.map(m=>{
    const rs=rows.filter(r=>r.it.m===m);
    const q=rs.reduce((t,r)=>t+r.qTot,0), a=rs.reduce((t,r)=>t+r.aTot,0);
    const hoje=(byDay.get(today)||[]).filter(r=>r.it.m===m).length;
    return {m,q,a,e:q-a,pct:q>0?a/q:null,alta:rs.filter(r=>r.pri.startsWith('🔴')).length,hoje};
  }).sort((x,y)=>(x.pct==null?9:x.pct)-(y.pct==null?9:y.pct));
  const tq=per.reduce((t,p)=>t+p.q,0), ta=per.reduce((t,p)=>t+p.a,0);
  const win=(from,to)=>{ let q=0,a=0; for(const s of sessions){ const d=dn(s.d); if(d>=from&&d<=to){q+=+s.q||0;a+=+s.ac||0;} } return q>0?a/q:null; };
  const p30=win(today-29,today), p60=win(today-59,today-30);
  const multi=rows.filter(r=>r.variacao!=null);
  const up=multi.filter(r=>r.variacao>0.00001).length, down=multi.filter(r=>r.variacao<-0.00001).length;
  const media=multi.length?multi.reduce((t,r)=>t+r.variacao,0)/multi.length*100:null;
  const count=f=>rows.filter(f).length;
  const kpi={
    materias:mats.length, assuntos:rows.length, hoje:(byDay.get(today)||[]).length,
    atrasados:count(r=>r.ativo&&r.AT!=null&&r.AT<0),
    prox:[...byDay.entries()].filter(([d])=>d>today&&d<=today+cfg.janela).reduce((t,[,l])=>t+l.length,0),
    alta:count(r=>r.pri.startsWith('🔴')),media:count(r=>r.pri.startsWith('🟠')),cons:count(r=>r.pri.startsWith('🟢')),
    peq:count(r=>r.pri.startsWith('⚪')),sem:count(r=>!r.pri)
  };
  const fracos=rows.filter(r=>r.pHist!=null&&r.qTot>=cfg.minAmostra).sort((x,y)=>x.pHist-y.pHist||x.idx-y.idx).slice(0,20);
  const dia=d=>{ let q=0,a=0; for(const s of sessions){ if(dn(s.d)===d){q+=+s.q||0;a+=+s.ac||0;} } return {d,q,a,pct:q>0?a/q:null}; };
  const hojeQ=dia(today), sem7=[]; for(let i=6;i>=0;i--) sem7.push(dia(today-i));
  return {hojeQ,sem7,per,tq,ta,te:tq-ta,pctGeral:tq>0?ta/tq:null,p30,p60,up,down,estavel:multi.length-up-down,nMulti:multi.length,media,kpi,fracos};
}

function vHoje(){

  <div class="bar" style="margin:12px 0 14px"><i style="width:${Math.min(100,done/lim*100)}%;background:var(--ok)"></i></div>`;

  const nb=S.ciclo?cicUpcoming(1).out[0]:null, nextKey=nb&&nb.sg&&nb.sg.it?cicItemKey(nb.k,nb.sg.it):null;
  h+=list.length?list.map(r=>card(r,{nextKey})).join(''):`<div class="empty">${done>=lim?'Meta do dia cumprida. 🎉':'Nada agendado para hoje.'}</div>`;
  const dias=[...M.byDay.keys()].filter(k=>k>t&&k<=t+S.cfg.janela).sort((a,b)=>a-b);
  if(dias.length){ h+=`<h2>Próximos dias</h2>`;
    for(const k of dias){ const dd=new Date(k*864e5); h+=`<div class="card"><div class="tag">${WD[dd.getUTCDay()]} ${fd(k)} · ${M.byDay.get(k).length} assuntos</div>`+M.byDay.get(k).map(r=>`<div class="hist row sp" onclick="openSel(${r.idx})" style="cursor:pointer"><div class="grow"><b>${esc(r.it.a)}</b><div class="sub">${esc(r.it.m)} · ${esc(r.it.s)}</div></div>${badge(r)}</div>`).join('')+`</div>`; } }

}

function cadTot(){cadLoad();let q=0,a=0,n=0;const ks=new Set(S.items.map(x=>keyOf(x.m,x.a,x.s)));for(const k in S.cad.cont){const c=S.cad.cont[k];if(c.q>0&&ks.has(k)){q+=c.q;a+=c.ac;n++}}return {q,a,n}}

const CADK={};function cadId(k){for(const i in CADK)if(CADK[i]===k)return i;const i='k'+Object.keys(CADK).length;CADK[i]=k;return i}
function cadBump(i,ok){const k=CADK[i],c=S.cad.cont[k]||(S.cad.cont[k]={q:0,ac:0});c.q++;if(ok)c.ac++;cadSave();cadPatch(i)}

function cadPatch(i){const k=CADK[i],it=S.items.find(x=>keyOf(x.m,x.a,x.s)===k),e=$('#cr-'+i);if(it&&e){const h=document.createElement('div');h.innerHTML=cadRow(it);e.replaceWith(h.firstElementChild)}
  const tb=$('#cad-tot');if(tb)tb.innerHTML=cadTotHtml();const at=$('#cad-at');if(at)at.innerHTML=cadAtivosHtml()}

async function cadSalvar(){const C=cadLoad(),t=cadTot();if(!t.q)return toast('Nenhuma questão marcada');if(!C.d)return toast('Informe a data');
  const l=cadMarcados().map(i=>({i,c:C.cont[keyOf(i.m,i.a,i.s)]}));
  let n=S.ses.filter(s=>s.d===C.d).length, base=Date.now();const novos=l.map((x,j)=>({_id:'s'+(base+j).toString(36),d:C.d,m:x.i.m,a:x.i.a,s:x.i.s,q:x.c.q,ac:x.c.ac,tipo:'Questões',motivo:'',obs:C.obs?('Caderno · '+C.obs):'Caderno',n:++n}));

function renderPv(){

async function saveReg(){

async function impBackup(inp){const f=inp.files[0];inp.value='';if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch(e){return toast('Arquivo inválido')}
  if(d.app!=='revisao-concursos'||!Array.isArray(d.items)||!Array.isArray(d.ses))return toast('Não é um backup deste app');
  if(S.pend!==f.name+f.size){S.pend=f.name+f.size;return toast('Toque em Restaurar e escolha o arquivo de novo para confirmar')}
  S.pend=null;toast('Restaurando…');
  try{
    S.items=d.items;S.cfg={...DEFAULT_CFG,...d.cfg};await saveItems();await saveCfg();
    if(d.versao>=2&&d.col){
      if(d.ciclo)await S.db.doc('app/ciclo').set(d.ciclo);
      const atual={sessoes:S.ses.map(x=>x._id),ciclo:(S.cic||[]).map(x=>x._id),sim_tent:(S.tents||[]).map(x=>x._id),qfeito:Object.keys(S.qf||{}),cartoes:Object.keys(S.cart||{}),flash:Object.keys(S.flash||{}),simulados:(S.simsDb||[]).map(x=>x.id)};
      for(const c of Object.keys(atual)){const novo=d.col[c]||{};
        for(const id of atual[c])if(!(id in novo))await S.db.collection(c).doc(id).delete();
        for(const id of Object.keys(novo))await S.db.collection(c).doc(id).set(novo[id])}
    }else{
      for(const s of S.ses) await S.db.collection('sessoes').doc(s._id).delete();
      let i=0;for(const s of d.ses){await S.db.collection('sessoes').doc('r'+Date.now().toString(36)+(i++)).set(s)}
    }
    toast('Backup restaurado')}catch(e){toast('Falha ao restaurar')}}
/* ===== CICLO TRT4 (aba Ciclo) =====
   Sequência de blocos de ~1h por fase; o próximo bloco é sempre o seguinte da sequência,
   não importa o dia. Cada bloco concluído ou adiado ocupa uma posição. */
const BIZU_K=new Set(['PT','DT','CON','ADM','CIV','PC','DH']);
const SIMP_K=new Set(['ADM','CON','CIV','DT','PC','POR','RL','INF','DH']);
function cicFase(t){const c=S.ciclo,d=iso(t);for(const f of c.fases){if((!f.ini||d>=f.ini)&&d<=f.fim)return f}return c.fases[c.fases.length-1]}
function cicDocsF(f){return S.cic.filter(x=>x.f===f.n)}
function cicConsumed(f){const s=new Set();for(const x of S.cic)if(x.f===f.n&&x.p!=null&&!x.fora)s.add(x.p);return s}
function cicFirstFree(f){const c=cicConsumed(f);let p=0;while(c.has(p))p++;return p}
function cicRowMap(){const m=new Map();if(M)for(const r of M.rows)m.set(r.key,r);return m}
function cicFeito(pred){return S.cic.filter(x=>x.st==='feito'&&pred(x)).length}
function cicResolve(k0,ord){
  if(k0==='RLINF'){const n=S.cic.filter(x=>x.k0==='RLINF').length+ord;return n%2?'INF':'RL'}
  if(k0==='GER'){const n=S.cic.filter(x=>x.k0==='GER').length+ord;return ['POR','RL','INF'][n%3]}
  return k0}

function simFc(n){S.simFcN=S.simFcN===n?null:n;render()}
async function simFcCopy(id){const e=$('#'+id);if(!e)return;let ok=false;
  try{await navigator.clipboard.writeText(e.value);ok=true}catch(x){try{e.focus();e.select();ok=document.execCommand('copy')}catch(y){}}
  toast(ok?'Copiado':'Não foi possível copiar: selecione o texto e copie manualmente')}
function vSimPend(sim,t){const nr=Object.keys(t.resp||{}).length;
  let h=`<div class="row sp"><h1 style="font-size:22px">${esc(sim.titulo)}</h1><button class="btn s" onclick="simExit()">Voltar</button></div>
   <div class="sub">Entregue em ${new Date(t.fim).toLocaleDateString('pt-BR')} · tempo ${simFmtT(t.gasto||0)} · ${nr} de ${sim.questoes.length} respondidas</div>
   <div class="msg" style="margin-top:10px">O gabarito oficial ainda não saiu. Suas respostas estão guardadas: quando o gabarito for gravado, esta tela vira a correção e você lança o resultado nas sessões.</div>
   <h2>Suas respostas</h2><div class="card"><div class="sim-grid">`+sim.questoes.map(q=>`<div class="sim-n ${t.resp[q.n]?'ok':''} ${t.marc&&t.marc[q.n]?'mk':''}" style="font-size:12px;text-align:center;line-height:1.25">${q.n}<br><b>${t.resp[q.n]||'–'}</b></div>`).join('')+`</div><div class="sub" style="margin-top:6px">Borda laranja: questões em que você ficou em dúvida.</div></div>`;
  if(sim.disc) h+=simDiscHtml(sim,t,!!(sim.disc.grade||sim.disc.espelho));
  return h}
async function simRegAgora(){const [t,sim]=simCur();if(!t||!sim||t.reg)return;await simRegistrar(t,sim)}
function simDiscHtml(sim,t,corr){const d=sim.disc,LN=d.linhas||30;
  let h=`<h2>Estudo de caso</h2><div class="card"><div class="ttl">${esc(d.titulo)}</div><div class="sim-enun">${esc(d.enun)}</div>
   <div class="sub" style="margin-top:8px">Escreva a resposta no papel, entre 20 e ${LN} linhas, como na prova. A grade de correção e a resposta-modelo aparecem depois da entrega.</div>
   ${d.dicas?`<details style="margin-top:8px"><summary class="sub" style="cursor:pointer"><b>Como a FCC espera a resposta</b></summary><ul class="sub" style="margin:6px 0 0 18px;padding:0">${d.dicas.map(x=>`<li style="margin:3px 0">${esc(x)}</li>`).join('')}</ul></details>`:''}</div>`;
  if(!corr) return h;
  if(!d.grade){
    h+=`<div class="card"><div class="tag">Espelho de correção</div>`+d.espelho.map(x=>`<div class="sim-com" style="margin-top:8px">${esc(x)}</div>`).join('')+`<div class="sub" style="margin-top:8px">${esc(d.criterios)}</div>
     <label for="sim-dn">Sua nota no estudo de caso (0 a 10)</label><div class="row" style="gap:8px"><input id="sim-dn" type="text" inputmode="decimal" placeholder="ex.: 7,5" value="${t.discNota!=null?String(t.discNota).replace('.',','):''}"><button class="btn p" onclick="simDiscSave()">Salvar nota</button></div>
     <div class="sub" style="margin-top:6px">A nota também entra no histórico de Discursiva do ciclo.</div></div>`;
    return h}
  const G=simGradeState(t),ck=id=>G.c.includes(id)?'checked':'',f=x=>nf(x,1);
  const item=(id,x,neg)=>`<label style="display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-weight:400;color:var(--ink);font-size:14px;line-height:1.4;cursor:pointer"><input type="checkbox" data-g="${id}" data-p="${x.p}" ${ck(id)} onchange="simGradeCalc()" style="width:20px;height:20px;margin:1px 0 0;flex-shrink:0"><span>${esc(x.t)} <b style="color:${neg?'var(--alta)':'var(--mut)'};white-space:nowrap">${neg?'−':''}${f(Math.abs(x.p))}</b></span></label>`;
  h+=`<div class="card" id="sim-grade"><div class="tag">Grade de correção</div><div class="sub" style="margin-top:4px">Releia o seu texto e marque cada elemento que você realmente escreveu e fundamentou. A nota é calculada sozinha.</div>`;
  d.grade.forEach((g,gi)=>{h+=`<div style="margin-top:12px"><b>${esc(g.q)}</b> <span class="sub">(${f(g.itens.reduce((a,x)=>a+x.p,0))})</span>${g.itens.map((x,ii)=>item(gi+'.'+ii,x)).join('')}</div>`});
  h+=`<div style="margin-top:12px"><b>Estrutura e expressão</b> <span class="sub">(${f((d.expr||[]).reduce((a,x)=>a+(x.niveis?Math.max(...x.niveis.map(n=>n[1])):x.p),0))})</span>`+(d.expr||[]).map((x,k)=>x.niveis
     ?`<div style="margin:8px 0"><div style="font-size:14px;margin-bottom:4px">${esc(x.t)}</div><select data-n="e${k}" onchange="simGradeCalc()">${x.niveis.map((n,ni)=>`<option value="${n[1]}" ${String(G.n['e'+k])===String(n[1])?'selected':''}>${esc(n[0])} (${f(n[1])})</option>`).join('')}</select></div>`
     :item('e'+k,x)).join('')+`</div>`;
  if(d.desc&&d.desc.length)h+=`<div style="margin-top:12px"><b>Descontos</b>${d.desc.map((x,k)=>item('d'+k,x,true)).join('')}</div>`;
  h+=`<div class="sub" id="sim-gt" style="margin-top:12px;font-size:15px"></div>
   <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">Ver resposta-modelo</summary><div class="sim-com" style="margin-top:8px;white-space:normal">${esc(d.modelo||'').split(/\n\s*\n/).map(p=>`<p style="margin:0 0 10px;text-indent:1.5em">${p}</p>`).join('')}</div></details>
   <div class="sub" style="margin-top:10px">${esc(d.criterios||'')}</div>
   <label for="sim-dn">Sua nota no estudo de caso (0 a 10)</label><div class="row" style="gap:8px"><input id="sim-dn" type="text" inputmode="decimal" placeholder="calculada pela grade" value="${t.discNota!=null?String(t.discNota).replace('.',','):''}"><button class="btn p" onclick="simDiscSave()">Salvar nota</button></div>
   <div class="sub" style="margin-top:6px">Dá para ajustar a nota à mão antes de salvar. Ela também entra no histórico de Discursiva do ciclo.</div></div>`;
  setTimeout(()=>simGradeCalc(true),0);
  return h}
/* estado da grade: o que foi marcado fica guardado na tentativa (e em memória até salvar) */
function simGradeState(t){S.discG=S.discG||{};const k=t._id||'x';if(!S.discG[k]||(t.discGrade&&!S.discG[k].c.length&&!Object.keys(S.discG[k].n||{}).length))S.discG[k]=t.discGrade?JSON.parse(JSON.stringify(t.discGrade)):{c:[],n:{}};const g=S.discG[k];g.c=g.c||[];g.n=g.n||{};return g}
function simGradeCalc(inicial){const box=$('#sim-grade');if(!box)return;const [t,sim]=simCur();if(!t||!sim||!sim.disc.grade)return;const G=simGradeState(t);
  let cont=0,ex=0,de=0;G.c=[];
  box.querySelectorAll('input[data-g]').forEach(e=>{if(!e.checked)return;G.c.push(e.dataset.g);const p=+e.dataset.p,id=e.dataset.g;if(id[0]==='d')de+=p;else if(id[0]==='e')ex+=p;else cont+=p});
  box.querySelectorAll('select[data-n]').forEach(e=>{G.n[e.dataset.n]=+e.value;ex+=+e.value});
  const nota=Math.max(0,Math.min(10,Math.round((cont+ex+de)*10)/10));
  const gt=$('#sim-gt');if(gt)gt.innerHTML=`Conteúdo <b>${nf(cont,1)}</b>/8 · Estrutura e expressão <b>${nf(ex,1)}</b>/2${de?` · Descontos <b style="color:var(--alta)">${nf(de,1)}</b>`:''} · <b style="font-size:17px;color:${nota>=6?'var(--ok)':'var(--alta)'}">Nota ${nf(nota,1)}</b> ${nota>=6?'(habilitaria)':'(abaixo do mínimo de 6,0)'}`;
  const dn=$('#sim-dn');if(dn&&(!inicial||t.discNota==null))dn.value=(G.c.length||Object.keys(G.n).length)?String(nota).replace('.',','):'';}
async function simDiscSave(){const [t,sim]=simCur();const n=parseFloat(String($('#sim-dn').value).replace(',','.'));if(isNaN(n)||n<0||n>10)return toast('Informe a nota de 0 a 10');
  t.discNota=Math.round(n*10)/10;if(sim.disc.grade){const G=simGradeState(t);t.discGrade={c:G.c.slice(),n:{...G.n}}}const {_id,...d}=t;
  try{await S.db.collection('sim_tent').doc(_id).set(clean(d));
    if(S.ciclo){const f=cicFase(T());const ex=S.cic.find(x=>x.simTent===_id&&x.k==='DISC');
      const doc={f:f.n,k0:'DISC',k:'DISC',st:'feito',d:iso(T()),t:Date.now(),lbl:'Estudo de caso do '+sim.titulo,nota:t.discNota,fora:true,simTent:_id};
      const id=ex?ex._id:'c'+Date.now().toString(36);await S.db.collection('ciclo').doc(id).set(doc)}
    toast('Nota do estudo de caso salva')}catch(e){toast('Não foi possível salvar a nota')}render()}
/* oferta: contar como bloco Simulado do ciclo */
function simCqSheet(){const c=S.simCq,sim=simById(c.sim);
  $('#ov').innerHTML=`<div class="sheet" onclick="if(event.target===this)simCqNo()"><div><div class="tag">Ciclo TRT4</div><h2 style="margin:4px 0 0">Contar como o bloco de simulado do ciclo?</h2>
   <div class="sub" style="margin-top:6px">${c.adId?'Há um bloco de Simulado adiado':'O próximo bloco do ciclo é o Simulado completo'}. Se contar, ele é concluído com ${c.res.ac}/${c.res.tot} acertos (nota ${nf(c.res.nota)}) e o ciclo avança para a correção.</div>
   <div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn p grow" onclick="simCqYes()">Contar como bloco</button><button class="btn" onclick="simCqNo()">Não</button></div></div></div>`}
function simCqNo(){S.simCq=null;render()}
async function simCqYes(){const c=S.simCq,sim=simById(c.sim);S.simCq=null;
  const base=c.adId?{...S.cic.find(x=>x._id===c.adId)}:cicSnap(c.b);delete base._id;
  const d={...base,st:'feito',d:iso(T()),t:Date.now(),lbl:sim.titulo,q:c.res.tot,ac:c.res.ac,fonte:'inedito:'+sim.id};
  try{const id=c.adId||('c'+Date.now().toString(36));if(!c.adId)S.cic.push({...d,_id:id});else S.cic=S.cic.map(x=>x._id===id?{...d,_id:id}:x);
    await S.db.collection('ciclo').doc(id).set(clean(d));toast('Bloco de simulado concluído no ciclo')}catch(e){toast('Não foi possível concluir o bloco')}render()}

RC_BOOT(function(){render();init();});
</script>
